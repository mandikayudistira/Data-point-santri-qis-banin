kind = "web"
previewPath = "/"
title = "SIPOS - Sistem Informasi Poin Santri"
version = "1.0.0"
id = "artifacts/sipos"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20416

[services.development]
run = "pnpm --filter @workspace/sipos run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sipos", "run", "build" ]
serve = "static"
publicDir = "artifacts/sipos/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20416"
BASE_PATH = "/"
